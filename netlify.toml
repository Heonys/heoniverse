[build]
  command = "pnpm install && pnpm build:client"
  publish = "apps/client/dist"

# monaco-editor 도입 후 vite 변환 단계가 Node 기본 힙(~2GB)을 초과해 OOM — 상한 확장
[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

# Rule for router history mode
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprinted bundles: content-hashed filenames, safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font files effectively never change; rename the file if one is ever replaced
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Stable-named public assets: cache 1 day, serve stale while revalidating
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/svg/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/cursor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
