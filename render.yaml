# Render 블루프린트 — 대시보드에서 New > Blueprint로 이 저장소를 연결하면
# 아래 정의대로 서비스가 생성된다. 자세한 절차는 DEPLOYMENT.md 참고.
services:
  - type: web
    name: heoniverse-server
    runtime: node
    plan: free
    region: singapore
    # NODE_ENV=production이면 pnpm이 devDependencies(tsup 등)를 건너뛰어 빌드가 깨진다.
    # install 단계에서만 NODE_ENV를 덮어써 빌드 도구를 확보한다 (런타임은 production 유지).
    buildCommand: NODE_ENV=development pnpm install && pnpm build:server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONITOR_PASSWORD
        sync: false # 대시보드에서 직접 입력 (/colyseus 모니터 basic-auth 비밀번호)
      - key: CORS_ORIGIN
        value: https://heoniverse.netlify.app
